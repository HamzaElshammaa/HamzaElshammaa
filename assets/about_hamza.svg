<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 265" width="100%" height="265">
  <defs>
    <clipPath id="clip-cmd1">
      <rect x="158" y="56" height="24" class="anim-clip-cmd1"/>
    </clipPath>
    <clipPath id="clip-line2">
      <rect x="28" y="88" height="24" class="anim-clip-line2"/>
    </clipPath>
    <clipPath id="clip-line3">
      <rect x="28" y="116" height="24" class="anim-clip-line3"/>
    </clipPath>
    <clipPath id="clip-line4">
      <rect x="28" y="144" height="24" class="anim-clip-line4"/>
    </clipPath>
    <clipPath id="clip-line5">
      <rect x="28" y="172" height="24" class="anim-clip-line5"/>
    </clipPath>
    <clipPath id="clip-cmd2">
      <rect x="158" y="210" height="24" class="anim-clip-cmd2"/>
    </clipPath>

    <style>
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        white-space: pre;
      }

      /* Clip-path width animations using discrete character steps */
      .anim-clip-cmd1 {
        width: 0px;
        animation: type-cmd1 16s infinite;
      }
      @keyframes type-cmd1 {
        0%, 2.5% { width: 0px; animation-timing-function: steps(16, end); }
        11.25%, 95% { width: 144px; }
        95.01%, 100% { width: 0px; }
      }

      .anim-clip-line2 {
        width: 0px;
        animation: type-line2 16s infinite;
      }
      @keyframes type-line2 {
        0%, 13.1% { width: 0px; animation-timing-function: steps(46, end); }
        20.6%, 95% { width: 805px; }
        95.01%, 100% { width: 0px; }
      }

      .anim-clip-line3 {
        width: 0px;
        animation: type-line3 16s infinite;
      }
      @keyframes type-line3 {
        0%, 20.6% { width: 0px; animation-timing-function: steps(42, end); }
        27.5%, 95% { width: 736px; }
        95.01%, 100% { width: 0px; }
      }

      .anim-clip-line4 {
        width: 0px;
        animation: type-line4 16s infinite;
      }
      @keyframes type-line4 {
        0%, 27.5% { width: 0px; animation-timing-function: steps(35, end); }
        33.1%, 95% { width: 572px; }
        95.01%, 100% { width: 0px; }
      }

      .anim-clip-line5 {
        width: 0px;
        animation: type-line5 16s infinite;
      }
      @keyframes type-line5 {
        0%, 33.1% { width: 0px; animation-timing-function: steps(38, end); }
        38.75%, 95% { width: 624px; }
        95.01%, 100% { width: 0px; }
      }

      .prompt2 {
        opacity: 0;
        animation: show-prompt2 16s infinite;
      }
      @keyframes show-prompt2 {
        0%, 38.74% { opacity: 0; }
        38.75%, 95% { opacity: 1; }
        95.01%, 100% { opacity: 0; }
      }

      .anim-clip-cmd2 {
        width: 0px;
        animation: type-cmd2 16s infinite;
      }
      @keyframes type-cmd2 {
        0%, 41.25% { width: 0px; animation-timing-function: steps(62, end); }
        66.25%, 95% { width: 544px; }
        95.01%, 100% { width: 0px; }
      }

      /* Cursor movement synchronized with typing heads */
      .cursor-pos {
        animation: cursor-track 16s infinite;
      }
      @keyframes cursor-track {
        0%, 2.5% {
          transform: translate(158px, 59px);
          animation-timing-function: steps(16, end);
        }
        11.25%, 13.09% {
          transform: translate(302px, 59px);
        }
        13.1% {
          transform: translate(28px, 91px);
          animation-timing-function: steps(46, end);
        }
        20.59% {
          transform: translate(833px, 91px);
        }
        20.6% {
          transform: translate(28px, 119px);
          animation-timing-function: steps(42, end);
        }
        27.49% {
          transform: translate(764px, 119px);
        }
        27.5% {
          transform: translate(28px, 147px);
          animation-timing-function: steps(35, end);
        }
        33.09% {
          transform: translate(600px, 147px);
        }
        33.1% {
          transform: translate(28px, 175px);
          animation-timing-function: steps(38, end);
        }
        38.74% {
          transform: translate(652px, 175px);
        }
        38.75%, 41.25% {
          transform: translate(158px, 213px);
          animation-timing-function: steps(62, end);
        }
        66.25%, 95% {
          transform: translate(702px, 213px);
        }
        95.01%, 100% {
          transform: translate(158px, 59px);
        }
      }

      .cursor-blink {
        animation: blinkCaret 0.65s step-end infinite;
      }
      @keyframes blinkCaret {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="4" y="4" width="852" height="257" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="4" y="4" width="852" height="38" rx="14" fill="#161b22"/>
  <rect x="4" y="28" width="852" height="14" fill="#161b22"/>
  <line x1="4" y1="42" x2="856" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic Light Buttons -->
  <circle cx="26" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="23" r="6" fill="#27c93f"/>
  <text x="430" y="28" text-anchor="middle" fill="#8b949e" class="term-text" font-size="13px">hamza@cairo: ~/portfolio (zsh)</text>

  <!-- Terminal Content -->
  <g class="term-text">
    <!-- Prompt 1 -->
    <text x="28" y="74">
      <tspan fill="#34d399">hamza@cairo</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#e6edf3">$ </tspan>
    </text>
    <!-- Typed Command 1 -->
    <g clip-path="url(#clip-cmd1)">
      <text x="158" y="74" textLength="138" lengthAdjust="spacing" fill="#e6edf3">whoami --verbose</text>
    </g>

    <!-- Line 2: role (preserving user's exact edited wording) -->
    <g clip-path="url(#clip-line2)">
      <text x="28" y="106" textLength="795" lengthAdjust="spacing">
        <tspan fill="#c084fc">role      </tspan><tspan fill="#8b949e">:: </tspan><tspan fill="#e6edf3">Junior AI/ML Engineer @ ElisaPolystar &amp; Full-Stack Developer &amp; Mobile Developer</tspan>
      </text>
    </g>

    <!-- Line 3: education -->
    <g clip-path="url(#clip-line3)">
      <text x="28" y="134" textLength="726" lengthAdjust="spacing">
        <tspan fill="#c084fc">education </tspan><tspan fill="#8b949e">:: </tspan><tspan fill="#e6edf3">B.Sc. Computer Science &amp; Engineering — German University in Cairo (GUC)</tspan>
      </text>
    </g>

    <!-- Line 4: research (preserving user's exact edited wording) -->
    <g clip-path="url(#clip-line4)">
      <text x="28" y="162" textLength="562" lengthAdjust="spacing">
        <tspan fill="#c084fc">research  </tspan><tspan fill="#8b949e">:: </tspan><tspan fill="#e6edf3">Hierarchical Reinforcement Learning (PPO) in Freeciv</tspan>
      </text>
    </g>

    <!-- Line 5: focus -->
    <g clip-path="url(#clip-line5)">
      <text x="28" y="190" textLength="614" lengthAdjust="spacing">
        <tspan fill="#c084fc">focus     </tspan><tspan fill="#8b949e">:: </tspan><tspan fill="#38bdf8">LLMs &amp; RAG</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#34d399">Next.js / NestJS / Expo</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#f472b6">60fps Smart TV Apps</tspan>
      </text>
    </g>

    <!-- Prompt 2 -->
    <text x="28" y="228" class="prompt2">
      <tspan fill="#34d399">hamza@cairo</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#38bdf8">~</tspan><tspan fill="#e6edf3">$ </tspan>
    </text>
    <!-- Typed Command 2 -->
    <g clip-path="url(#clip-cmd2)">
      <text x="158" y="228" textLength="536" lengthAdjust="spacing">
        <tspan fill="#e6edf3">status --current </tspan><tspan fill="#34d399">"Open to exciting engineering opportunities!"</tspan>
      </text>
    </g>

    <!-- Moving & Blinking Block Cursor -->
    <g class="cursor-pos">
      <rect class="cursor-blink" x="0" y="0" width="9" height="17" fill="#38bdf8"/>
    </g>
  </g>
</svg>