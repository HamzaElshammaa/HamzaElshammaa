<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="320">
  <defs>
    <style>
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-size: 14.5px;
      }
      .line1 { opacity: 0; animation: fadeIn 12s infinite 0.3s; }
      .line2 { opacity: 0; animation: fadeIn 12s infinite 1.2s; }
      .line3 { opacity: 0; animation: fadeIn 12s infinite 1.8s; }
      .line4 { opacity: 0; animation: fadeIn 12s infinite 2.4s; }
      .line5 { opacity: 0; animation: fadeIn 12s infinite 3.0s; }
      .line6 { opacity: 0; animation: fadeIn 12s infinite 3.6s; }
      .line7 { opacity: 0; animation: fadeIn 12s infinite 4.2s; }
      .line8 { opacity: 0; animation: fadeIn 12s infinite 4.8s; }
      .line9 { opacity: 0; animation: fadeIn 12s infinite 5.4s; }
      .blink { animation: blinkCaret 0.8s step-end infinite; }
      @keyframes fadeIn {
        0%, 92% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes blinkCaret {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="4" y="4" width="852" height="312" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="4" y="4" width="852" height="38" rx="14" fill="#161b22"/>
  <rect x="4" y="28" width="852" height="14" fill="#161b22"/>
  <line x1="4" y1="42" x2="856" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic Light Buttons -->
  <circle cx="26" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="23" r="6" fill="#27c93f"/>
  <text x="430" y="28" text-anchor="middle" fill="#8b949e" class="term-text" font-size="13px">hamza@cairo: ~/portfolio (zsh)</text>

  <!-- Terminal Content -->
  <g class="term-text">
    <text x="28" y="74" class="line1">
